name: Android build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Build pull request APK
        if: github.event_name == 'pull_request'
        run: ./gradlew assembleDebug

      - name: Restore release signing key
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.AUTOSKIP_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/autoskip-release.jks"

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        env:
          AUTOSKIP_KEYSTORE_PATH: ${{ runner.temp }}/autoskip-release.jks
          AUTOSKIP_KEYSTORE_PASSWORD: ${{ secrets.AUTOSKIP_KEYSTORE_PASSWORD }}
          AUTOSKIP_KEY_ALIAS: ${{ secrets.AUTOSKIP_KEY_ALIAS }}
          AUTOSKIP_KEY_PASSWORD: ${{ secrets.AUTOSKIP_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Name APK
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          VERSION=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)
          cp app/build/outputs/apk/release/app-release.apk "AutoSkip-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "AutoSkip-latest.apk"
          echo "APK_NAME=AutoSkip-${VERSION}.apk" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: autoskip-apk
          path: |
            ${{ env.APK_NAME }}
            AutoSkip-latest.apk

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_FLAGS=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            RELEASE_FLAGS+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" "${APK_NAME}" "AutoSkip-latest.apk" \
            --generate-notes --title "AutoSkip ${GITHUB_REF_NAME}" "${RELEASE_FLAGS[@]}"
