plugins {
    id "com.android.application"
}

def releaseKeystorePath = System.getenv("AUTOSKIP_KEYSTORE_PATH")
def releaseKeystorePassword = System.getenv("AUTOSKIP_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("AUTOSKIP_KEY_ALIAS")
def releaseKeyPassword = System.getenv("AUTOSKIP_KEY_PASSWORD")

android {
    namespace "com.autoskip.mobile"
    compileSdk 35

    defaultConfig {
        applicationId "com.autoskip.mobile"
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "0.2.0-beta.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (releaseKeystorePath) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation "androidx.core:core:1.15.0"
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.constraintlayout:constraintlayout:2.2.1"
    implementation "com.google.android.material:material:1.13.0"

    testImplementation "junit:junit:4.13.2"
}
